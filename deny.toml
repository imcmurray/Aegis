# Phase 10 / D15 dependency policy. Frozen crypto pins are reviewed, not
# auto-upgraded: ml-dsa 0.1.1, ml-kem 0.3.2, argon2 0.5, chacha20poly1305 0.10,
# hkdf 0.12, sha2 0.10.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]
all-features = false

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is unmaintained and pulled only by freenet-stdlib 0.8.4. Aegis vault/backup/recovery/sync/share serialization is ciborium, not bincode. Replacing Freenet's serializer is not an Aegis suite/protocol change." },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "LGPL-3.0-only",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []
skip = []
# Do not retarget ml-dsa / ml-kem to pick up a newer crates.io release.
# Suite IDs 0x0003 and 0x0004 stay bound to the frozen pins.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
