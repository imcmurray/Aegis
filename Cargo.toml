[workspace]
members = [
    "common",
    "contracts/vault-sync",
    "delegates/vault-delegate",
    "tools/dev-vault-server",
    "tools/wasm-hash",
    "tools/browser-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ianm/Aegis"
rust-version = "1.80"

[workspace.dependencies]
aegis-common = { path = "common" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
ciborium = "0.2"
thiserror = "2"

# Crypto
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets", "serde"] }
blake3 = "1"
rand = "0.8"
rand_core = "0.6"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
hex = "0.4"
bs58 = "0.5"

# Freenet
freenet-stdlib = { version = "0.8.4", default-features = false }

[profile.release]
lto = true
opt-level = "z"
